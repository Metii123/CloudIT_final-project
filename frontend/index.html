<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTW Events Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="brand">HTW Campus-Events</a>
            <ul class="nav-links">
                <li><a href="index.html">Events</a></li>
                <li><a href="myRegistrations.html">My Registrations</a></li>
                <li><a href="organizerDashboard.html">Organizer Dashboard</a></li>
            </ul>

            <select id="role-switch">
                <option value="guest">Guest</option>
                <option value="student">Student</option>
                <option value="organizer">Organizer</option>
            </select>
        </nav>
    </header>

    <main>
        <section id="event-listing">
            <h1>Upcoming Events</h1>

            <form id="filter-form">
                <label for="category-filter">Category
                    <select id="category-filter" name="category">
                        <option value="">All</option>
                        <option value="workshop">Workshop</option>
                        <option value="social">Social</option>
                        <option value="career">Career</option>
                        <option value="academic">Academic</option>
                    </select>
                </label>

                <label for="department-filter">Department
                    <select id="department-filter" name="department">
                        <option value="">All</option>
                    </select>
                </label>

                <label for="date-sort">Date
                    <select id="date-sort" name="date-sort">
                        <option value="soonest">Soonest first</option>
                        <option value="latest">Latest first</option>
                    </select>
                </label>
            </form>

            <div id="event-list" class="event-grid">

            </div>
        </section>
    </main>

    <footer>
        <p>2026 HTW Campus-Events Hub / Metehan Cakmak</p>
        <button id="reset-data-btn" type="button">Reset local demo data</button>
    </footer>

    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
