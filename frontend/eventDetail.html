<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - Campus Events Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="brand">Campus Events</a>
            <ul class="nav-links">
                <li><a href="index.html">Events</a></li>
                <li><a href="myRegistrations.html">My Registrations</a></li>
                <li><a href="organizerDashboard.html">Organizer Dashboard</a></li>
            </ul>

            <select id="role-switch">
                <option value="guest">Guest</option>
                <option value="student">Student</option>
                <option value="organizer">Organizer</option>
            </select>
            
        </nav>
    </header>
        
    <main>
        <section id="event-detail">
            <h1 id="event-title">Event Title</h1>
            <p id="event-description"></p>
            <dl>
                <dt>Date</dt><dd id="event-date"></dd>
                <dt>Time</dt><dd id="event-time"></dd>
                <dt>Location</dt><dd id="event-location"></dd>
                <dt>Department</dt><dd id="event-department"></dd>
                <dt>Category</dt><dd id="event-category"></dd>
                <dt>Spots left</dt><dd id="event-capacity"></dd>
            </dl>

            <a href="register.html" id="register-link" class="btn">Register for this Event</a>
        </section>
    </main>

    <footer>
        <p>2026 Campus Events Hub</p>
        <button id="reset-data-btn" type="button">Reset local demo data</button>
    </footer>    

    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
