<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Events Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="brand">Campus Events</a>
            <ul class="nav-links">
                <li><a href="index.html">Events</a></li>
                <li><a href="myRegistrations.html">My Registrations</a></li>
                <li><a href="organizerDashboard.html">Organizer Dashboard</a></li>
            </ul>

            <select id="role-switch">
                <option value="guest">Guest</option>
                <option value="student">Student</option>
                <option value="organizer">Organizer</option>
            </select>
            
        </nav>
    </header>

    <main>
        <section id="register-section">
            <h1>Register for <span id="register-event-name">this event</span></h1>

            <form id="register-form" novalidate>
                <input type="hidden" id="event-id" name="eventId">

                <label for="student-name">Full name
                    <input type="text" id="student-name" name="studentName" required>
                </label>
                <span class="error" id="error-name"></span>

                <label for="student-email">Email
                    <input type="email" id="student-email" name="studentEmail" required>
                </label>
                <span class="error" id="error-email"></span>

                <label for="notes">Notes (optional)
                    <textarea id="notes" name="notes"></textarea>
                </label>

                <button type="submit">Confirm Registration</button>
            </form>

            <p id="confirmation-message" hidden>You're registered!</p>
        </section>
    </main>

    <footer>
        <p>2026 Campus Events Hub</p>
        <button id="reset-data-btn" type="button">Reset local demo data</button>
    </footer>    

    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
